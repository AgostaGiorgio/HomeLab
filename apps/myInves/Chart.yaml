apiVersion: v2
name: myInves
description: Chart to deploy MyInves using generic applications chart
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: backend
    alias: myInves-be
    version: 1.0.0
    repository: "file://../../charts/applications"
    condition: myInves-be.enabled
  - name: frontend
    alias: myInves-fe
    version: 1.0.0
    repository: "file://../../charts/applications"
    condition: myInves-fe.enabled