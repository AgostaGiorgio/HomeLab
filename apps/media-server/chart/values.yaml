# Flaresolverr - Cloudflare solver
flaresolverr:
  enabled: true
  nameOverride: ""
  fullnameOverride: ""
  replicaCount: 1
  
  image:
    repository: ghcr.io/flaresolverr/flaresolverr
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8191
  
  ingress:
    enabled: false


qbittorrent:
  enabled: true
  replicaCount: 1

  image:
    repository: lscr.io/linuxserver/qbittorrent
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    http:
      port: 8080
    torrent:
      tcp: 6881
      udp: 6881

  persistence:
    config:
      enabled: true
      existingClaim: media-server-pvc
      mountPath: /config
    downloads:
      enabled: true
      existingClaim: media-server-pvc
      mountPath: /downloads
    incomplete:
      enabled: true
      existingClaim: media-server-pvc
      mountPath: /downloads/incomplete

  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-production-cluster-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    host: qbittorrent.agogi.dev
    tls:
      enabled: true
      secretName: qbittorrent-tls-secret