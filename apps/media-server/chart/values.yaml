# Global values for the media stack
global:
  domain: agogi.dev
  timezone: "Asia/Dubai"
  puid: "1000"
  pgid: "1000"

# Jellyfin - Media server
jellyfin:
  enabled: true
  nameOverride: ""
  fullnameOverride: ""
  replicaCount: 1
  
  image:
    repository: jellyfin/jellyfin
    tag: "10.10.7"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8096
  
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-production-cluster-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: jellyfin.agogi.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - jellyfin.agogi.dev
        secretName: jellyfin-tls-secret
  
  persistence:
    media:
      enabled: true
      accessMode: ReadWriteMany
      size: 50Gi
      existingClaim: "media-server-pvc"
  
  env:
    JELLYFIN_PublishedServerUrl: "https://jellyfin.agogi.dev"
    TZ: "Asia/Dubai"
  
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi


# Radarr - Movie management
radarr:
  enabled: true
  nameOverride: ""
  fullnameOverride: ""
  replicaCount: 1
  
  image:
    repository: linuxserver/radarr
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 7878
  
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-production-cluster-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    host: radarr.agogi.dev
    tls:
      enabled: true
      secretName: radarr-tls-secret
  
  persistence:
    media:
      enabled: true
      size: 10Gi
      existingClaim: "media-server-pvc"
  
  env:
    TZ: "Asia/Dubai"
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi


