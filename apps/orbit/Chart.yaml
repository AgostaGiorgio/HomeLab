apiVersion: v2
name: orbit
description: Chart to deploy orbit using generic applications chart
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: base-application
    alias: orbit-be
    version: 0.1.0
    repository: "file://../../charts/applications"
    condition: orbit-be.enabled
  - name: base-application
    alias: orbit-fe
    version: 0.1.0
    repository: "file://../../charts/applications"
    condition: orbit-fe.enabled