orbit-be: 
  enabled: true
  fullnameOverride: orbit-be


  image:
    registry: registry.agogi.dev
    repository: orbit_be
    tag: "1.0.0"
    pullPolicy: Always

  replicaCount: 1

  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-production-cluster-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    className: "traefik"
    hosts:
      - host: api.orbit.agogi.dev
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
        - api.orbit.agogi.dev
        secretName: api.orbit-tls-secret


orbit-fe: 
  enabled: true
  fullnameOverride: orbit-fe

  image:
    registry: registry.agogi.dev
    repository: orbit_fe
    tag: "1.0.0"
    pullPolicy: Always

  replicaCount: 1

  service:
    enabled: true
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-production-cluster-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: orbit.agogi.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - orbit.agogi.dev
        secretName: orbit-tls-secret

  env:
    - name: VITE_API_BASE_URL
      value: https://api.orbit.agogi.dev
