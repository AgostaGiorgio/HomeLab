myinves-be: 
  enabled: true
  fullnameOverride: myinves-be

  image:
    registry: registry.agogi.dev
    repository: myinves_be
    tag: "1.0.0"
    pullPolicy: Always

  replicaCount: 1

  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080

  ingress:
    enabled: false

  envFromSecrets:
    - name: myinves-secrets

  env:
    # Postgres configuration
    - name: POSTGRESQL_CONNECTION_URI
      value: postgresql+asyncpg://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_DATABASE}
    - name: POSTGRES_HOST
      value: postgresql.postgres.svc.cluster.local
    - name: POSTGRES_PORT
      value: "5432"
    - name: POSTGRES_DATABASE
      value: myinves

myinves-fe: 
  enabled: true
  fullnameOverride: myinves-fe

  image:
    registry: registry.agogi.dev
    repository: myinves_fe
    tag: "1.0.0"
    pullPolicy: Always

  replicaCount: 1

  service:
    enabled: true
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-production-cluster-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: myinves.agogi.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
        - myinves.agogi.dev
        secretName: myinves-tls-secret

  env:
    - name: VITE_API_BASE_URL
      value: myinves-be.myinves.svc.cluster.local:8080
