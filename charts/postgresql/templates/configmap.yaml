{{- if .Values.postgresql.initdbScripts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.fullname" . }}-init-scripts
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.postgresql.initdbScripts }}
  {{ $key }}: |
    {{- $value | nindent 4 }}
  {{- end }}
{{- end }}