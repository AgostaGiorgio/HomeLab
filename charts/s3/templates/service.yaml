apiVersion: v1
kind: Service
metadata:
  name: {{ include "s3.fullname" . }}
  labels:
    {{- include "s3.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "s3.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.console.enabled }}
    - port: {{ .Values.service.console.port }}
      targetPort: console
      protocol: TCP
      name: console
    {{- end }}
