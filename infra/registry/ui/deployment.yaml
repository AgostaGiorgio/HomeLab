apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
  namespace: registry
  labels:
    app: registry-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-ui
  template:
    metadata:
      labels:
        app: registry-ui
    spec:
      containers:
      - name: registry-ui
        image: joxit/docker-registry-ui:latest
        ports:
        - containerPort: 80
          name: http
        env:
        # Use nginx proxy pass instead of direct registry URL
        # This avoids mixed content issues (HTTPS page -> HTTP registry)
        - name: NGINX_PROXY_PASS_URL
          value: http://docker-registry:5000
        # Set to true for single registry mode
        - name: SINGLE_REGISTRY
          value: "true"
        # Registry title in the UI
        - name: REGISTRY_TITLE
          value: "HomeLab Docker Registry"
        # Enable delete feature
        - name: DELETE_IMAGES
          value: "true"
        # Show content digest
        - name: SHOW_CONTENT_DIGEST
          value: "true"
        # Catalog elements limit (number of repos to show)
        - name: CATALOG_ELEMENTS_LIMIT
          value: "1000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5