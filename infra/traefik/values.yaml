deployment:
  replicas: 1

ports:
  web:
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true
  traefik:
    port: 9000
    expose:
      default: false

ingressRoute:
  dashboard:
    enabled: false
    entryPoints:
      - websecure
      - web
    matchRule: Host(`traefik-dashboard.agogi.dev`)

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: true

globalArguments:
  - "--global.checknewversion=false"
  - "--global.sendanonymoususage=false"

additionalArguments:
  - "--log.level=INFO"
  - "--accesslog=true"
  - "--entrypoints.web.address=:80"
  - "--entrypoints.websecure.address=:443"
  - "--api.dashboard=false"
  - "--ping=true"
  # readtimeout/writetimeout coprono l'INTERA request, body incluso: con un
  # upload lento (push di layer grandi verso registry.agogi.dev) 180s non
  # bastano e Traefik chiude la connessione a metà -> "broken pipe" lato client.
  # 0 = nessun limite (streaming illimitato). idletimeout resta per le
  # connessioni inattive.
  - "--entrypoints.websecure.transport.respondingtimeouts.readtimeout=0"
  - "--entrypoints.websecure.transport.respondingtimeouts.writetimeout=0"
  - "--entrypoints.websecure.transport.respondingtimeouts.idletimeout=180s"
  - "--entrypoints.websecure.transport.keepalivemaxtime=0"
  - "--entrypoints.websecure.transport.keepalivemaxrequests=0"

resources:
  requests:
    cpu: 100m
    memory: 50Mi
  limits:
    cpu: 300m
    memory: 150Mi