apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: git@github.com:AgostaGiorgio/HomeLab.git
      targetRevision: master
      path: shared/postgres/config
      directory:
        include: "*.yaml"
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: 15.2.0
      helm:
        releaseName: postgres
        valueFiles:
          - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true