image:
  tag: "16.4.0-debian-12-r0"
postgresqlSharedPreloadLibraries: "pg_stat_statements"

auth:
  username: "admin"
  database: "postgres"
  existingSecret: postgres-secrets
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  persistence:
    enabled: true
    existingClaim: postgres-pvc
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  extendedConfiguration: |
    max_connections = 200
    shared_buffers = 128MB
    effective_cache_size = 512MB
    maintenance_work_mem = 64MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 655kB
    min_wal_size = 1GB
    max_wal_size = 4GB
    max_wal_senders = 10
    wal_level = replica

readReplicas:
  replicaCount: 0

backup:
  enabled: false

networkPolicy:
  enabled: false

# Metrics and monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # Set to true if you have Prometheus Operator
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

service:
  type: NodePort
  nodePorts:
    postgresql: 30432
  port: 5432
