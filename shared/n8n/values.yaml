n8n: 
  enabled: true
  fullnameOverride: n8n


  image:
    registry: registry.agogi.dev
    repository: custom-n8n
    tag: latest
    pullPolicy: Always

  replicaCount: 1

  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 5678

  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: cloudflare-production-cluster-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: n8n.agogi.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - n8n.agogi.dev
        secretName: n8n-tls-secret

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi" 

  volumes:
    - name: n8n-storage
      persistentVolumeClaim:
        claimName: n8n-pvc

  volumeMounts:
    - name: n8n-storage
      mountPath: /home/node/.n8n

  env:
    - name: N8N_BASIC_AUTH_ACTIVE
      value: "false"
    - name: WEBHOOK_URL
      value: "https://n8n.agogi.dev/"
    - name: N8N_EDITOR_BASE_URL
      value: "https://n8n.agogi.dev/"
    - name: GENERIC_TIMEZONE
      value: "Asia/Dubai"
    - name: N8N_RUNNERS_MODE
      value: "external"
    - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
      value: "0.0.0.0"
    - name: N8N_PORT
      value: "5678"

  envFromSecrets:
    - name: n8n-runner-token

  extraContainers:
    - name: task-runners
      image: "registry.agogi.dev/custom-n8n-runners:2.6.2"
      imagePullPolicy: Always
      env:
        - name: N8N_RUNNERS_TASK_BROKER_URI
          value: "http://127.0.0.1:5679"
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-runner-token
              key: N8N_RUNNERS_AUTH_TOKEN
        - name: N8N_RUNNERS_LAUNCHER_LOG_LEVEL
          value: "info"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
    
