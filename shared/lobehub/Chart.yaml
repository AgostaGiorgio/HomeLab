apiVersion: v2
name: lobehub
description: Chart to deploy LobeHub (Lobe Chat) using the generic application chart with a dedicated ParadeDB backend
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: base-application
    alias: lobehub
    version: 0.1.0
    repository: "file://../../charts/applications"
    condition: lobehub.enabled

  - name: postgresql
    version: 1.0.0
    repository: "file://../../charts/postgresql"
    condition: postgresql.enabled
