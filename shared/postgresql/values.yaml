postgresql:
  enabled: true

  postgresql:
    image:
      registry: docker.io
      repository: postgres
      tag: "15"
      pullPolicy: IfNotPresent

    persistence:
      enabled: true
      existingClaim: "postgres-pvc"
      mountPath: /var/lib/postgresql/data
      subPath: "pgdata"

  service:
    type: NodePort
    port: 5432
    nodePort: 30432
