ollama:  
  enabled: true

  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  models:
    path: /models
    pull:
    - SparkLLM/Spark-X2.5-4B:q4_K_M

  storage:
    enabled: true
    createPV: true
    storageClassName: "local-ssd"
    size: 100Gi
    hostPath: /mnt/ssd1/ollama/models

  service:
    type: NodePort
    port: 11434
    nodePort: 30434